<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MA - Mural</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <h1>Mural de Egressos</h1>
        <p>Conheça alguns dos nossos ex-alunos.</p>
    </header>

    <main>

        <section class="filtros">

            <input
                type="text"
                placeholder="Pesquisar egresso..."
            >

            <select>
                <option>Todos os cursos</option>
                <option>Desenvolvimento de Sistemas</option>
                <option>Administração</option>
                <option>Enfermagem</option>
            </select>

            <select>
                <option>Todos os anos</option>
                <option>2025</option>
                <option>2024</option>
                <option>2023</option>
            </select>

        </section>

        <section class="cards">

            <div class="card">

                <div class="foto">
                    Foto
                </div>

                <h2>Nome do Egresso</h2>

                <p>Curso</p>

                <p>2025</p>

                <button>Ver mais</button>

            </div>

            <div class="card">

                <div class="foto">
                    Foto
                </div>

                <h2>Nome do Egresso</h2>

                <p>Curso</p>

                <p>2024</p>

                <button>Ver mais</button>

            </div>

            <div class="card">

                <div class="foto">
                    Foto
                </div>

                <h2>Nome do Egresso</h2>

                <p>Curso</p>

                <p>2023</p>

                <button>Ver mais</button>

            </div>

            <div class="card">

                <div class="foto">
                    Foto
                </div>

                <h2>Nome do Egresso</h2>

                <p>Curso</p>

                <p>2022</p>

                <button>Ver mais</button>

            </div>

        </section>

    </main>

</body>
</html>
